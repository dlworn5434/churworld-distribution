name: Build macOS DMG (free, manual install)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
      - name: Extract launcher source in distribution repository
        run: |
          if [[ ! -f package.json ]]; then
            unzip -q launcher-source.zip
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tools/tests/*.test.js
      - run: npm run dist:mac:${{ matrix.arch }}
      - name: Verify app architecture and local signature
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: bash tools/verify-mac-build.sh "$TARGET_ARCH"
      - name: Save DMG for download (does not publish a release)
        uses: actions/upload-artifact@v4
        with:
          name: ChurWorld-macOS-${{ matrix.arch }}
          path: dist/ChurWorld-Launcher-setup-*-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 7
